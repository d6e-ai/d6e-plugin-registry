# Discover d6e plugins from GitHub repositories tagged "d6e-plugin"
# (the legacy "d6e-app" topic is still accepted) and update the registry.
#
# Manual only. A six-hour schedule kept spending Actions minutes while the
# registry was idle. Start it by hand:
#
#   gh workflow run discover-plugins.yml --ref <branch>
name: Discover Plugins

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Discover and update registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-plugins.mjs
