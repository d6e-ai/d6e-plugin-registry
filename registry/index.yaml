plugins:
  - namespace: d6e
    name: accounting-assistant
    description:
      en-US: AI-powered accounting assistant with journal entry validation and chart of accounts.
      ja-JP: 仕訳検証と勘定科目表を備えたAI搭載の会計アシスタント。
    tier: verified
    category: business
    icon: calculator
    latestVersion: v1.0.0
  - namespace: d6e
    name: data-quality-checker
    description:
      en-US: Validates datasets against configurable rules and reports quality issues.
