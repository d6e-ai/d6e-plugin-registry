readme: |
  ## Accounting Assistant

  AI-powered bookkeeping helper for Japanese businesses. Validates journal entries,
  suggests account codes, and ensures debit/credit balance.

  ### What's Included

  - **Template Prompt**: Accounting specialist persona with J-GAAP knowledge
  - **STF**: `validate-journal-entry` — Checks that debit and credit totals match
  - **File**: `chart-of-accounts.csv` — Standard 勘定科目一覧 with 38 common accounts

  ### Use Cases

  - Validate journal entries before posting
  - Look up account codes by name
  - Get help with complex accounting transactions
  - Generate financial summaries from transaction data

  ### Example

  Ask the AI: "Verify this journal entry: Debit Cash 100,000 / Credit Sales 100,000"
  → The AI calls the validation STF and confirms the entry is balanced.
