readme: |
  ## Hello World

  A minimal d6e App that demonstrates the template structure.
  Includes a simple JS STF that returns a greeting message.

  ### What's Included

  - **Template Prompt**: A friendly greeting assistant persona
  - **STF**: `hello` — Returns a personalized greeting message

  ### Usage

  After installing, the AI agent will automatically adopt the greeting assistant persona.
  Ask it to greet someone and it will use the hello STF.
