readme:
  en-US: |
    ## Valuation

    AI-powered valuation automation for Financial Advisory Services.
    Performs DCF analysis, comparable company analysis, WACC calculation,
    and EBITDA multiple valuation.

    ### What's Included

    - **Template Prompt**: Valuation specialist persona
    - **JS STFs**: `valuation-wacc` (WACC/beta/DCF), `valuation-multiple` (EBITDA multiples)
    - **Docker STFs**: `report-generator`, `jquants-client`, `edinet-client`, `excel-template-filler`
    - **Effects**: J-Quants API, EDINET API, JSDA bond yields, file output

    ### Use Cases

    - Calculate WACC using CAPM
    - Perform DCF valuation
    - Comparable company analysis with EBITDA multiples
    - Generate Word valuation reports
    - Fetch financial data from EDINET and J-Quants
  ja-JP: |
    ## 企業価値評価

    FAS（ファイナンシャル・アドバイザリー・サービス）向けのAI企業価値評価自動化。
    DCF分析、類似企業比較分析、WACC算定、EBITDAマルチプルバリュエーションを実行します。

    ### 含まれるもの

    - **テンプレートプロンプト**: 企業価値評価専門家ペルソナ
    - **JS STF**: `valuation-wacc`（WACC/ベータ/DCF）、`valuation-multiple`（EBITDAマルチプル）
    - **Docker STF**: `report-generator`、`jquants-client`、`edinet-client`、`excel-template-filler`
    - **エフェクト**: J-Quants API、EDINET API、JSDA国債利回り、ファイル出力

    ### ユースケース

    - CAPMによるWACC算定
    - DCFバリュエーション
    - EBITDAマルチプルによる類似企業比較分析
    - Word形式のバリュエーションレポート生成
    - EDINETおよびJ-Quantsからの財務データ取得
